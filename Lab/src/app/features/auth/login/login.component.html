<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <mat-icon class="auth-logo">school</mat-icon>
      <h1>ÉduÉvénements</h1>
      <p>Accédez à votre plateforme d'événements éducatifs</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Adresse Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="exemple@mail.com">
        <mat-icon matPrefix class="form-icon">email</mat-icon>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">L'adresse email est requise</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">L'adresse email doit être valide</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" placeholder="••••••••">
        <mat-icon matPrefix class="form-icon">lock</mat-icon>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Le mot de passe est requis</mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Le mot de passe doit comporter au moins 6 caractères</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || loading" class="auth-submit-btn">
        <span *ngIf="!loading">Se connecter</span>
        <mat-progress-spinner diameter="20" mode="indeterminate" *ngIf="loading" class="spinner-btn"></mat-progress-spinner>
      </button>

    </form>

    <div class="auth-footer">
      <span>Nouveau sur la plateforme ? </span>
      <a routerLink="/login/register" class="auth-link">Créer un compte</a>
    </div>
  </div>
</div>
