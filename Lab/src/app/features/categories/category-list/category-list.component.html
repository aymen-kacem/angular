<div class="page-container">
  <div class="header-section">
    <div class="title-container">
      <h1>Gestion des Catégories</h1>
      <p>Gérez les différentes catégories d'événements disponibles sur la plateforme</p>
    </div>
    <div class="action-container">
      <button mat-raised-button color="primary" (click)="openCreateDialog()" class="btn-create">
        <mat-icon>add</mat-icon> Ajouter une Catégorie
      </button>
    </div>
  </div>

  <div class="filter-section">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher une catégorie</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex: Workshop..." #input>
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <app-loading-spinner *ngIf="loading" message="Chargement des catégories..."></app-loading-spinner>

  <div class="table-container mat-elevation-z8" *ngIf="!loading">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom de la Catégorie </th>
        <td mat-cell *matCellDef="let category" class="category-name-cell"> {{ category.name }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let category">
          <button mat-icon-button color="primary" (click)="openEditDialog(category)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCategory(category)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-table-cell" colspan="2">Aucune catégorie ne correspond à la recherche "{{ input.value }}"</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Sélectionner la page"></mat-paginator>
  </div>
</div>
