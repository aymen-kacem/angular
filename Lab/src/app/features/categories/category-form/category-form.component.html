<h2 mat-dialog-title class="dialog-title">
  <mat-icon color="primary">{{ isEditMode ? 'edit' : 'add_circle' }}</mat-icon>
  <span>{{ isEditMode ? "Modifier la Catégorie" : "Ajouter une Catégorie" }}</span>
</h2>

<form [formGroup]="form" (ngSubmit)="save()" class="category-form-container">
  <mat-dialog-content class="dialog-content">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nom de la Catégorie</mat-label>
        <input matInput formControlName="name" placeholder="Ex: Workshop">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Le nom de la catégorie est requis.</mat-error>
        <mat-error *ngIf="form.get('name')?.hasError('minlength')">Le nom doit contenir au moins 2 caractères.</mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button type="button" (click)="close()" class="btn-cancel">Annuler</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" class="btn-save">
      Sauvegarder
    </button>
  </mat-dialog-actions>
</form>
